services:

  app1:
    build: ../
    container_name: springboot_app1
    ports:
      - "8081:8080"
    depends_on:
      - redis
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - springnet

  app2:
    build: ../
    container_name: springboot_app2
    ports:
      - "8082:8080"
    depends_on:
      - redis
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - springnet

  app3:
    build: ../
    container_name: springboot_app3
    ports:
      - "8083:8080"
    depends_on:
      - redis
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    networks:
      - springnet

  redis:
    image: redis
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - springnet

  nginx:
    image: nginx:latest
    container_name: nginx_load_balancer
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - springnet

networks:
  springnet:
    driver: bridge

volumes:
  redis_data: